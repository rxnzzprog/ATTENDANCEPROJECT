<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Attendance Management System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- HTML5 QR Code Scanner Library (CDN with fallback) -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- =========================================================
         1. LOGIN VIEW (Initial Unauthenticated State)
         ========================================================= -->
    <div id="auth-container" class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-icon">
                    <i class="fa-solid fa-qrcode"></i>
                </div>
                <h1>PRMSU QR Attendance System</h1>
                <p>PRMSU Attendance Management Portal</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username"><i class="fa-solid fa-user"></i> Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter your username" required
                        autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required
                        autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fa-solid fa-right-to-bracket"></i> Log In
                </button>
            </form>

            <div class="demo-credentials">
                <strong><i class="fa-solid fa-key"></i> Quick Demo Logins (Click to Auto-fill):</strong>
                <div>
                    <span class="demo-acc-badge" onclick="fillDemo('admin', 'admin123')">Admin: admin</span>
                    <span class="demo-acc-badge" onclick="fillDemo('prof.smith', 'teacher123')">Teacher:
                        prof.smith</span>
                    <span class="demo-acc-badge" onclick="fillDemo('john.doe', 'student123')">Student: john.doe</span>
                </div>
            </div>
        </div>
    </div>

    <!-- =========================================================
         2. MAIN APPLICATION CONTAINER (Authenticated Dashboards)
         ========================================================= -->
    <div id="app-container" class="app-container" style="display: none;">

        <!-- SIDEBAR NAVIGATION -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="brand-icon">
                    <i class="fa-solid fa-qrcode"></i>
                </div>
                <div>
                    <h2>QR Attendance</h2>
                    <span id="role-badge" class="badge badge-info" style="font-size: 10px;">Role</span>
                </div>
            </div>

            <nav id="sidebar-nav" class="sidebar-nav">
                <!-- Navigation items dynamically injected by JS based on role -->
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile-badge">
                    <div id="user-avatar" class="user-avatar">U</div>
                    <div class="user-info">
                        <div id="user-display-name" class="user-name">User Name</div>
                        <div id="user-display-role" class="user-role">Role</div>
                    </div>
                    <button class="btn btn-secondary" style="padding: 6px 10px;" onclick="logout()" title="Log Out">
                        <i class="fa-solid fa-power-off"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">

            <header class="top-bar">
                <div class="page-title">
                    <h1 id="page-heading">Dashboard</h1>
                    <p id="page-subheading">Welcome to the QR Code Attendance System</p>
                </div>
                <div class="top-actions">
                    <span id="current-time-display"
                        style="font-size: 13px; font-weight: 600; color: var(--slate-600);"></span>
                </div>
            </header>

            <!-- DYNAMIC VIEW PANELS CONTAINER -->
            <div id="view-content"></div>

        </main>
    </div>

    <!-- =========================================================
         3. MODALS FOR CRUD OPERATIONS
         ========================================================= -->
    <!-- Generic Form Modal -->
    <div id="form-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">Form Title</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-body">
                <!-- Dynamic form inputs -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/teacher.js"></script>
    <script src="js/student.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/app.js"></script>

    <script>
        function fillDemo(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }
    </script>
</body>

</html>
